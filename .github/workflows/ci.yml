name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Build (ESP-IDF v6.0)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build

      - name: Check binary size
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py size

  clang-tidy:
    name: Clang-Tidy
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-tidy
        run: |
          apt-get update -qq
          apt-get install -y -qq clang-tidy

      - name: Run clang-tidy via idf.py
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py clang-check --run-clang-tidy-py run-clang-tidy

  clang-format:
    name: Clang-Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format

      - name: Check formatting
        run: |
          find components/ main/ -name '*.c' -o -name '*.h' \
            | xargs clang-format --dry-run --Werror
